    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Manrope:wght@400;500;600&amp;display=swap');
      .num { font-family: 'Cormorant Garamond','Cormorant',Georgia,'Times New Roman',serif; font-size: 60px; font-weight: 500; fill: url(#num); text-anchor: middle; }
      .lbl { font-family: 'Manrope','Outfit','Helvetica Neue',Arial,sans-serif; font-size: 15px; letter-spacing: 0.6px; fill: #a39a80; text-anchor: middle; }
      .ico { fill: none; stroke: #c9a961; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="20" y="20" width="1220" height="200" rx="20" fill="url(#panel)"/>
  <rect x="20.5" y="20.5" width="1219" height="199" rx="19.5" fill="none" stroke="url(#border)" stroke-width="1.25"/>

  <rect x="325" y="44" width="1" height="152" fill="url(#divider)"/>
  <rect x="630" y="44" width="1" height="152" fill="url(#divider)"/>
